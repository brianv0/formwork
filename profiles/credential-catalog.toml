# The credential-location catalog (FW-CRED1): the typed, versioned successor to the informal
# sensitive set (FW-TRA3, superseded by FEP-2 §11). Locations only -- paths and environment
# variable names -- never content signatures. The whole catalog is denied/stripped by default
# (FW-CRED4); the only lift is the explicit typed exclude, `allow-credentials = ["<type>"]` /
# `--allow-cred <type>` (FW-CRED5). Discovery can never propose a grant that matches this file
# (FW-DISC3 / FW-INV8).
#
# Embedded into `formwork-blueprint` at build time (`include_str!`) so the pure compiler needs no
# I/O; `~` expands against the launcher's $HOME at the CLI edge. Two location kinds, two arms
# (FW-CRED2): `paths` -> the OS confiner (EACCES); `envs` -> the launcher (variable absent).
# `env-file-refs` names env vars whose *value* is a file path: excluding the type strips the var
# AND denies the referenced file (FW-CRED3). An entry is the bare variable name, or
# `{ var = "<name>", list = true }` for a variable whose value is a `:`-separated list of files,
# each of which is denied (FW-CRED33). `env-dir-refs` names env vars whose value is a directory a
# tool uses in place of one of the type's `~` roots, as `{ var = "<name>", replaces = "<root>" }`:
# while the variable is set, every path of the type below `replaces` is also denied below the
# variable's value (FW-CRED32). The variable is not stripped and the `~` rows stay. An entry is
# added only for a variable its tool documents or was seen to honour; the fixture in
# crates/formwork-cli/tests/profiles.rs lists the ones left out, and why. `services` are service
# locations (FW-CRED13): `mach:` names on macOS, `bus:` names and `runtime:` sockets under
# $XDG_RUNTIME_DIR on Linux.
# `broker` says how the Gateway presents a type written `broker:<type>` in allow-credentials
# (FW-CRED11): one `{ hosts, scheme }` pair per set of hosts. The credential's source is the type's
# first env var set on the launching host.

version = 4

# --- cloud / CI credentials -------------------------------------------------------------------

[types.aws]
paths = ["~/.aws/**"]
envs = [
    "AWS_ACCESS_KEY_ID",
    "AWS_SECRET_ACCESS_KEY",
    "AWS_SESSION_TOKEN",
    # container/workload credential channels: the ECS/EKS credential endpoints and the IRSA
    # projected token; the *_FILE vars point at token files, denied via env-file-refs.
    "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI",
    "AWS_CONTAINER_CREDENTIALS_FULL_URI",
    "AWS_WEB_IDENTITY_TOKEN_FILE",
    "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE",
    "AWS_SHARED_CREDENTIALS_FILE",
    # ~/.aws/config holds SSO sessions and `credential_process` commands, and may hold keys.
    "AWS_CONFIG_FILE",
]
env-file-refs = [
    "AWS_WEB_IDENTITY_TOKEN_FILE",
    "AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE",
    "AWS_SHARED_CREDENTIALS_FILE",
    "AWS_CONFIG_FILE",
]

[types.gcp]
paths = ["~/.config/gcloud/**"]
envs = ["GOOGLE_APPLICATION_CREDENTIALS"]
env-file-refs = ["GOOGLE_APPLICATION_CREDENTIALS"]
# gcloud and the Google auth libraries read CLOUDSDK_CONFIG; they do not follow XDG_CONFIG_HOME.
env-dir-refs = [{ var = "CLOUDSDK_CONFIG", replaces = "~/.config/gcloud" }]

[types.azure]
paths = ["~/.azure/**"]
envs = ["AZURE_CLIENT_SECRET", "AZURE_FEDERATED_TOKEN_FILE", "AZURE_CLIENT_CERTIFICATE_PATH"]
env-file-refs = ["AZURE_FEDERATED_TOKEN_FILE", "AZURE_CLIENT_CERTIFICATE_PATH"]
env-dir-refs = [{ var = "AZURE_CONFIG_DIR", replaces = "~/.azure" }]

[types.kube]
paths = ["~/.kube/**"]
envs = ["KUBECONFIG"]
# kubectl merges every file the list names.
env-file-refs = [{ var = "KUBECONFIG", list = true }]

[types.docker]
# The whole dir: ~/.docker/run/docker.sock is host-root (FW-TRA8).
paths = ["~/.docker/**"]
# DOCKER_CERT_PATH names the directory of the client's TLS key, which defaults to the config dir.
env-dir-refs = [
    { var = "DOCKER_CONFIG", replaces = "~/.docker" },
    { var = "DOCKER_CERT_PATH", replaces = "~/.docker" },
]

[types.secrets-mount]
# Runtime-mounted workload credentials: Kubernetes service-account tokens
# (/var/run/secrets/kubernetes.io), EKS IRSA projected tokens, Docker/ECS secrets. /var/run is
# usually a symlink to /run; both spellings are listed so dry-run policies read right on any host
# (enforcement canonicalizes anyway).
paths = ["/run/secrets/**", "/var/run/secrets/**"]

# --- keys and key stores ----------------------------------------------------------------------

[types.ssh]
paths = ["~/.ssh/**"]

[types.gpg]
paths = ["~/.gnupg/**"]
env-dir-refs = [{ var = "GNUPGHOME", replaces = "~/.gnupg" }]

[types.keychain]
paths = ["~/Library/Keychains/**", "/Library/Keychains/**"]

# --- forges / registries ----------------------------------------------------------------------

[types.github]
paths = ["~/.config/gh/**", "~/.git-credentials"]
envs = ["GITHUB_TOKEN", "GH_TOKEN"]
# gh keeps hosts.yml in GH_CONFIG_DIR, else $XDG_CONFIG_HOME/gh, else ~/.config/gh.
env-dir-refs = [
    { var = "GH_CONFIG_DIR", replaces = "~/.config/gh" },
    { var = "XDG_CONFIG_HOME", replaces = "~/.config" },
]
# `git push` over HTTPS authenticates with Basic (user x-access-token); the REST API with Bearer.
broker = [
    { hosts = ["github.com"], scheme = "basic:x-access-token" },
    { hosts = ["api.github.com"], scheme = "bearer" },
]

[types.netrc]
paths = ["~/.netrc"]
# Read in place of ~/.netrc by Go (GOAUTH=netrc) and by Python's requests.
envs = ["NETRC"]
env-file-refs = ["NETRC"]

[types.npm]
paths = ["~/.npmrc"]
envs = ["NPM_TOKEN", "NODE_AUTH_TOKEN"]

[types.cargo]
# The publish token only -- ~/.cargo/** itself stays usable (registry caches are the ambient
# toolchain, FW-TRA1).
paths = ["~/.cargo/credentials.toml", "~/.cargo/credentials"]
envs = ["CARGO_REGISTRY_TOKEN"]
# Only the two token files move with it; the rest of $CARGO_HOME stays the ambient toolchain.
env-dir-refs = [{ var = "CARGO_HOME", replaces = "~/.cargo" }]

[types.pypi]
paths = ["~/.pypirc"]
envs = ["TWINE_PASSWORD"]

# --- model / SaaS APIs ------------------------------------------------------------------------

[types.anthropic]
paths = ["~/.anthropic/**"]
envs = ["ANTHROPIC_API_KEY"]
broker = [{ hosts = ["api.anthropic.com"], scheme = "header:x-api-key" }]

[types.openai]
envs = ["OPENAI_API_KEY"]
broker = [{ hosts = ["api.openai.com"], scheme = "bearer" }]

[types.slack]
envs = ["SLACK_BOT_TOKEN", "SLACK_TOKEN"]

# --- agent-tool state: OAuth creds, API keys, transcripts (FW-TRA8) ----------------------------
# One confined agent must not read another's secrets. A launcher that runs a *specific* agent
# excludes that agent's own type (e.g. `--allow-cred claude` under Claude Code).

[types.claude]
paths = ["~/.claude/**", "~/.claude.json"]
# On macOS Claude Code keeps its login in the keychain, so lifting `claude` there reaches the
# keychain's services too -- as one service, every item that does not prompt (FEP-5 §3.4).
services = ["mach:com.apple.SecurityServer", "mach:com.apple.securityd", "mach:com.apple.securityd.xpc"]
# With the variable set, Claude Code keeps its `.claude.json` inside the directory it names.
env-dir-refs = [{ var = "CLAUDE_CONFIG_DIR", replaces = "~/.claude" }]

[types.codex]
paths = ["~/.codex/**"]
env-dir-refs = [{ var = "CODEX_HOME", replaces = "~/.codex" }]

[types.gemini]
paths = ["~/.gemini/**"]

[types.cursor]
paths = ["~/.cursor/**"]

# --- browser profiles (session cookies are credentials) ----------------------------------------

[types.browser]
paths = [
    "~/Library/Application Support/Google/Chrome/**",
    "~/Library/Application Support/Firefox/**",
    "~/.config/google-chrome/**",
    "~/.mozilla/**",
]
# Chrome on Linux keeps its profiles under $CHROME_CONFIG_HOME, else $XDG_CONFIG_HOME, else
# ~/.config.
env-dir-refs = [
    { var = "CHROME_CONFIG_HOME", replaces = "~/.config" },
    { var = "XDG_CONFIG_HOME", replaces = "~/.config" },
]

# --- system credential stores -----------------------------------------------------------------

[types.os-keyring]
# The OS keyring as a service (FW-CRED13): the macOS keychain daemon, and on Linux the Secret
# Service on the session bus and the keyring daemon's sockets. On Linux the Secret Service shares
# the session bus with `run-outside`, so lifting this type lifts that bus (reported Partial).
services = [
    "mach:com.apple.SecurityServer",
    "mach:com.apple.securityd",
    "mach:com.apple.securityd.xpc",
    "bus:org.freedesktop.secrets",
    "runtime:keyring/control",
    "runtime:keyring/ssh",
]

[types.system]
paths = ["/etc/shadow", "/etc/sudoers", "/etc/sudoers.d/**"]

# --- project-local secrets at any depth (FW-CAP6 `**/` form, FW-TRA8) --------------------------

[types.dotenv]
# The whole family, anywhere: `**/.env` is the landed FW-TRA8 contract, and its variants belong
# to the same type so one exclusion decision covers them all.
paths = [
    "**/.env",
    "**/.env.local",
    "**/.env.development",
    "**/.env.test",
    "**/.env.staging",
    "**/.env.production",
    # The untracked per-machine override of each environment's file.
    "**/.env.development.local",
    "**/.env.test.local",
    "**/.env.staging.local",
    "**/.env.production.local",
]

# --- generic backstop (FW-CRED6) ---------------------------------------------------------------
# Sensible-shaped secrets with no curated type stay covered: files literally named like
# credentials or SSH private keys, at ANY depth anywhere. A catch-all is location-independent by
# nature -- it must reach the containers, CI runners, and project trees where uncatalogued secrets
# actually live, not just `$HOME`, and stay denied even under a broad grant (FW-CRED6). The cost is
# paid honestly, not silently: these any-depth rows compile to a floating Seatbelt regex and cannot
# be rooted by Landlock, so where unenforceable they are reported Partial, never claimed enforced
# (FW-CRED9). Liftable only as the whole named pseudo-type `backstop` (coarse on purpose; prefer
# narrowing a real type).

[backstop]
paths = [
    "**/credentials",
    "**/credentials.json",
    "**/.netrc",
    "**/.git-credentials",
    "**/id_rsa",
    "**/id_dsa",
    "**/id_ecdsa",
    "**/id_ecdsa_sk",
    "**/id_ed25519",
    "**/id_ed25519_sk",
]
