# Continuous integration: format, lint, and test the workspace on every push to main or an agent
# branch and every PR.
# Uses only first-party `actions/*` and the runner's preinstalled rustup — no third-party actions,
# to keep the supply-chain surface of a sandboxing tool minimal (constitution: enforcement is real,
# not assumed). Release artifacts are built separately in release.yml.
name: CI

on:
  push:
    # Agent branches run CI on every push, so platform work (macOS above all, which no agent
    # container can run) is verified on real runners before a pull request exists.
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# One in-flight run per ref; a newer push supersedes an older, still-running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt clippy
          cache-prefix: lint

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native OS backends differ (Seatbelt on macOS; Landlock/seccomp on Linux), so the
        # suite must run on both. Integration tests that need a real kernel mechanism are cfg-gated
        # to their OS, so a stock runner exercises exactly what it can enforce. Each job carries
        # its learn-usefulness probe against its real feed: macOS FW-E2E-064 (a millisecond
        # workload's denial must survive unified-log persistence latency) via Seatbelt +
        # `log show`; Linux FW-E2E-071 (the same millisecond shape) via Landlock + the strace
        # ptrace feed.
        #
        # FEP-5 §6.2: ubuntu-24.04 restricts unprivileged user namespaces through AppArmor, so the
        # `isolate` refusal path runs on a real runner beside 22.04's working tier; macos-15 beside
        # macos-14 because Seatbelt service names and sysctl behavior change across releases.
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix: test

      # The Linux learn feed (FW-E2E-071) traces the workload with strace; installing it here is
      # what lets the ubuntu job EXECUTE the ptrace-feed tests instead of skipping them -- a
      # platform-marked test that never runs on its platform is a claim, not a verification.
      # strace: the Linux learn feed. dbus, glib's gdbus and Xvfb: the session-bus and display
      # fixtures the channel tests connect to (FW-E2E-082, FW-E2E-087). curl: the egress probes.
      # Distribution packages, not actions.
      - name: Install Linux test fixtures
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y strace dbus libglib2.0-bin xvfb curl

      # The FW-E2E-094 client matrix drives Go and uv clients; Go is in the runner's tool cache but
      # not on PATH, and uv comes from the runner's preinstalled `pipx` (not a third-party action).
      - name: Put Go and uv on PATH
        shell: bash
        run: |
          go_bin=$(ls -d "$RUNNER_TOOL_CACHE"/go/*/*/bin 2>/dev/null | sort -V | tail -1)
          if [ -n "$go_bin" ]; then echo "$go_bin" >> "$GITHUB_PATH"; fi
          pipx install uv

      - name: Build
        run: cargo build --workspace --locked

      # FW_REQUIRE_EXERCISED: a platform test that cannot exercise its mechanism on a CI runner
      # fails instead of skipping (FEP-5 §6.1) -- a skipped platform test is a claim, not a
      # verification. It also covers the README quickstart (D1) and the agent examples starting
      # under the baseline (FW-E2E-084).
      # --no-fail-fast: every test binary runs, so one run reports every failure on the platform;
      # the summary step repeats each failure at the end of the log, where it is read first.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"
        env:
          FW_REQUIRE_EXERCISED: "1"

      # FW-E2E-094: the client matrix, recorded in the log on each OS (FEP-6 §4.11).
      - name: Client matrix (recorded)
        shell: bash
        run: |
          cargo test -p formwork-cli --test fep6_run --locked fw_e2e_094 -- --nocapture 2>&1 \
            | sed -n '/client matrix:/,/^test /p'

      - name: Test failure summary
        if: failure()
        shell: bash
        run: grep -E -A20 '^---- |^test .* FAILED$|targets? failed' "$RUNNER_TEMP/test.log" | head -600

      # The Python black-box harness drives the built `formwork` binary at the outermost real
      # boundary; platform-inappropriate tests skip via markers (macOS Seatbelt vs Linux Landlock),
      # so each OS runs exactly what it can enforce. `uv`, installed above, matches the
      # Dockerfile's uv-managed harness.
      - name: Python E2E harness
        working-directory: py
        run: uv run pytest -q

  # Integration test of MCP pattern shading (FW-GW9/FW-E2E-068) against a real, published MCP
  # server. Kept a separate Linux job because it pulls a pinned npm package at test time (network),
  # which the hermetic unit/integration suite above deliberately does not. The runner ships node, so
  # no third-party action is added (constitution: minimal supply-chain surface for a sandbox tool).
  mcp-integration:
    name: mcp-integration (real server)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix: mcp

      - name: Show node version (preinstalled on the runner)
        run: node --version && npx --version

      # `--ignored` runs exactly the network-dependent real-server test; it fetches the pinned
      # @modelcontextprotocol/server-everything and drives it through the gateway with a regex policy.
      - name: Regex shading against a real MCP server
        run: cargo test -p formwork-gateway --test real_server --locked -- --ignored --nocapture

  # FW-E2E-084 with real agents: install Claude Code, codex and opencode from npm (network, like
  # mcp-integration) and run each one's non-interactive smoke command under `learn` with its shipped
  # blueprints; the run must propose nothing the example does not document.
  agent-examples:
    name: agent examples
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix: agents

      - name: Install strace and the agents
        run: |
          sudo apt-get update && sudo apt-get install -y strace
          npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai

      - name: Agent examples under the baseline
        run: cargo test -p formwork-cli --test fep5_run --locked fw_e2e_084 -- --nocapture
        env:
          FW_REQUIRE_EXERCISED: "1"

  # Enforce the declared MSRV (Cargo.toml `rust-version`). Without this the pin is documentation
  # only: every other job uses stable, so post-1.85 code could merge green while violating it.
  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.85"
          cache-prefix: msrv

      - name: Check on the declared minimum supported Rust version
        run: cargo check --workspace --locked
