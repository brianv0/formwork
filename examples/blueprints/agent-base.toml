# The filesystem and environment every agent example shares. It carries no network posture: each
# agent's blueprint adds host rules (`claude-code.toml`, `codex.toml`, `opencode.toml`). Where host
# rules are refused (Linux without connect supervision), add the port tier on the command line
# instead -- `--net ports:443` -- which reaches any HTTPS host. The two cannot mix (FW-BP13).
#
#   reads   the whole ambient environment MINUS the compiled-in credential floor (keys, cloud
#           creds, keychains, browser profiles -- profiles/credential-catalog.toml).
#   writes  one project tree + scratch. Point this at your repo.
#   exec    unrestricted, so the agent runs tools freely; set an allowlist to restrict execve.

exec = "unrestricted"
# Drop secret-shaped env vars; each agent's blueprint re-admits the model key it needs, if any.
env = { scrub = {} }

[fs]
read-mode = "ambient-minus-subtract"
reads = ["/**"]
writes = ["~/project/**", "/tmp/**", "/private/tmp/**", "/var/tmp/**"]
# Credential locations are NOT listed here: the compiled-in catalog floor denies them all under
# every blueprint, minus exactly each agent's `allow-credentials`.
subtract = []

# Tamper vectors: write-denied but readable, so the agent can't plant a git hook / .mcp.json / IDE
# task that later runs unsandboxed, yet git and tooling still read them.
write-subtract = [
    "**/.git/hooks/**",
    "**/.git/config",
    "**/.mcp.json",
    "**/.vscode/**",
    "**/.idea/**",
]
