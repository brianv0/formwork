# codex with an API key, brokered (FEP-5 §3.2). The agent's OPENAI_API_KEY is a per-session
# placeholder; the Gateway terminates TLS for api.openai.com (the `any:` rule inspects it, HTTPS and
# the WebSocket transport alike), swaps in the real key on that host only, and refuses the
# placeholder anywhere else. codex reads the session CA through SSL_CERT_FILE, which the Launcher
# sets (verified with codex 0.157).
#
# The run is refused before it starts if OPENAI_API_KEY is not set in the launching shell. Create
# ~/.codex once outside the sandbox (`mkdir -p ~/.codex`).
#
# Deliberately refused, and harmless to codex: ab.chatgpt.com (analytics), github.com and
# api.github.com (release checks), files.openai.com.

extends = ["agent-base.toml"]

rules = [
    "any:api.openai.com",
    "https:chatgpt.com",
]
allow-credentials = ["codex", "broker:openai"]

[fs]
writes = ["~/.codex/**"]
