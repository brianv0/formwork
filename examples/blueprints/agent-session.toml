# Sandbox for an interactive coding agent (Claude Code / codex / opencode) launched under
# `formwork run`, with PORT-scoped egress. The kernel -- not the agent's own permission prompts --
# is the wall, which is what makes it safe to hand the agent its "skip every prompt" flag.
#
# Prefer the host-scoped blueprint for your agent (`claude-code.toml`, `codex.toml`,
# `opencode.toml`): there every connection goes through the session Gateway and only the named
# hosts are reachable. This one is for hosts that cannot carry host rules (Linux without connect
# supervision), and it stays the portable baseline the docs' recipes build on.
#
# On top of `agent-base.toml` it deliberately WIDENS in the axes one agent needs -- :443 egress for
# the model API, this agent's own ~/.claude kept writable, and two model-API-key env vars
# re-admitted -- while every other secret stays denied. Review these widenings before use.
#
#   net     HTTPS egress only. This is port-scoped, not host-scoped: treat :443 as "any HTTPS
#           host". The fs sandbox is what stops secrets being read to exfiltrate at all.

extends = ["agent-base.toml"]

net = { ports = [443] }
# Scrub secret-shaped env vars but keep the model auth the agent needs. Egress is open
# to any HTTPS host, so this stops e.g. AWS_SECRET_ACCESS_KEY being exfiltrated via the environment.
env = { scrub = { allow = ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN"] } }
# The two DELIBERATE widenings, reviewed here so they are visible: `anthropic` lets the
# model API key through the launcher strip (the scrub allow above alone cannot -- the catalog floor
# partitions first), and `claude` lets THIS agent read/write its own ~/.claude state. Every other
# catalog type -- aws, ssh, gcp, other agents' state, ... -- stays denied/stripped.
allow-credentials = ["anthropic", "claude"]

[fs]
# This agent's own state dir, so Claude can persist history/settings/auth.
writes = ["~/.claude/**"]
